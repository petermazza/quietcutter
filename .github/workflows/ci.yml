name: ci
on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SESSION_SECRET: ci-test-secret-not-real
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quietcutter_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quietcutter_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get install -y ffmpeg postgresql-client
      - run: npm ci
      - run: PGPASSWORD=postgres createdb -h localhost -U postgres quietcutter_test
      - run: npm run db:push
      - run: npm run check
      - run: npm test
      - run: npm run test:flood
      - run: npm run check:audit
